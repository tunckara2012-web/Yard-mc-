<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#06080c;--pn:#0e131b;--tx:#dfe6ee;--mu:#6f7c8c;--c:#4cc9f0;box-sizing:border-box;color-scheme:dark}
*{box-sizing:inherit;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 38%,color-mix(in srgb,var(--c) 14%,var(--bg)),var(--bg) 62%);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);transition:background .6s;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:12px 0}
.tabs{display:flex;gap:4px;flex:1}
.tab{background:none;border:0;color:var(--mu);font:600 13px system-ui;letter-spacing:.14em;padding:8px 7px;border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--c)}
.ic{background:none;border:0;color:var(--mu);width:36px;height:40px;font-size:20px;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:10px}
canvas{width:min(78vw,320px);height:min(78vw,320px);cursor:pointer}
#st{font:600 12px system-ui;letter-spacing:.3em;color:var(--c);min-height:18px}
#tr{width:100%;max-width:420px;text-align:center;min-height:96px;max-height:30vh;overflow:auto;padding:0 6px}
#me{color:var(--mu);font-size:14px}
#ai{color:var(--tx);font-size:16px;margin-top:6px}
footer{display:flex;gap:8px;padding:10px 0 14px}
#tx{flex:1;min-width:0;background:var(--pn);border:1px solid #1b2430;border-radius:22px;color:var(--tx);padding:0 16px;height:46px;font:16px system-ui}
#tx:focus-visible,button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid #1b2430;background:var(--pn);color:var(--tx);font-size:19px;cursor:pointer}
#mic{background:var(--c);color:#06080c;border-color:var(--c)}
#mic.off{background:var(--pn);color:var(--mu);border-color:#1b2430}
#ov{position:fixed;inset:0;background:rgba(6,8,12,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:5}
#ov h1{font:700 28px system-ui}
#ov p{color:var(--mu);max-width:320px}
#ov input{width:100%;max-width:340px;height:46px;border-radius:12px;border:1px solid #2a3544;background:var(--pn);color:var(--tx);padding:0 14px;font:16px system-ui}
.bt{width:100%;max-width:340px;height:48px;border-radius:12px;border:1px solid var(--c);background:var(--c);color:#06080c;font:700 16px system-ui;cursor:pointer}
.bt.g{background:none;color:var(--tx);border-color:#2a3544}
.hid{display:none!important}
#pn{position:fixed;inset:0;background:rgba(6,8,12,.97);z-index:6;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto}
#pn h2{font:700 22px system-ui}
#pn p{color:var(--mu);font-size:14px}
.nt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--pn);border-radius:12px;padding:8px 8px 8px 14px}
.nt button{background:none;border:0;color:var(--c);font:600 14px system-ui;padding:8px;cursor:pointer}
.row{display:flex;gap:8px}
#ni{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid #2a3544;background:var(--pn);color:var(--tx);padding:0 14px;font:16px system-ui}
#pn .bt{max-width:none}
#tp,#hp{position:fixed;inset:0;background:rgba(6,8,12,.97);z-index:6;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto}
#tp h2,#hp h2{font:700 22px system-ui}
#tp input{height:44px;border-radius:12px;border:1px solid #2a3544;background:var(--pn);color:var(--tx);padding:0 14px;font:16px system-ui;min-width:0}
#tp .bt,#hp .bt{max-width:none}
.hi{background:var(--pn);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;margin-bottom:8px}
.hi small{font-weight:600;letter-spacing:.1em}
.tk{background:var(--pn);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.tk b{font-weight:600}.tk.dn b{text-decoration:line-through;color:var(--mu)}
.tk small{color:var(--mu)}
.tk .row{margin-top:6px}
.tk .row button{flex:1;height:38px;border-radius:10px;border:1px solid #2a3544;background:none;color:var(--tx);font:600 13px system-ui;cursor:pointer}
#rq{width:100%;max-width:420px;background:var(--pn);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:center;font-size:14px}
#rq .bt{width:auto;flex:1;height:40px;font-size:14px}
#cq{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:4;background:var(--pn);border:1px solid #1b2430;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
#cq .bt{max-width:none;height:44px;font-size:15px}
#cvid.fr{transform:scaleX(-1)}
#cvid{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:14px;width:96px;height:128px;object-fit:cover;border-radius:12px;border:1px solid var(--c);z-index:2}
#cs{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#0d1722,var(--bg) 70%);z-index:5;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px}
.cd{height:96px;border-radius:18px;border:1px solid var(--k);background:linear-gradient(135deg,color-mix(in srgb,var(--k) 24%,#0e131b),#0e131b);color:var(--tx);font:700 22px system-ui;letter-spacing:.28em;cursor:pointer}
.cn{color:var(--c);font:700 13px system-ui;letter-spacing:.2em;margin-left:6px}
.sbar{position:sticky;top:0;z-index:2;display:flex;gap:6px;background:#06080c;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 10px}
.sbar button{flex:1;height:40px;border-radius:10px;border:1px solid #1b2430;background:var(--pn);color:var(--mu);font:600 13px system-ui;cursor:pointer}
.sbar button.on{color:var(--tx);border-color:var(--c)}
.sbar .x{flex:0 0 auto;padding:0 14px;color:var(--tx)}
#hp,#tp,#pn{padding-top:0}
canvas{transition:opacity .9s,filter .9s}
canvas.sleep{opacity:.35;filter:saturate(.5)}
@keyframes wk{0%{transform:scale(.88)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
canvas.wake{animation:wk 1.1s ease-out}
.tk small{white-space:pre-wrap}
.ck{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:14px}
#tp .ck input,#pn .ck input{width:22px;height:22px}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <button class="ic hid" id="hb" aria-label="Geçmiş">🕘</button>
  <button class="ic hid" id="tkb" aria-label="Görevler">☑</button>
  <button class="tab" id="gear" aria-label="Ayarlar">⚙ AYARLAR</button>
</header>
<main>
  <canvas id="cv" width="640" height="640" aria-label="Konuşmayı yeniden bağla"></canvas>
  <div id="st">HAZIR</div>
  <div id="tr" aria-live="polite"><div id="me"></div><div id="ai"></div></div>
  <div id="rq" class="hid"><span id="rqt"></span><div class="row"><button class="bt" id="rqy">Devam et</button><button class="bt g" id="rqn">Beklesin</button></div></div>
  <video id="cvid" class="hid" playsinline muted></video>
</main>
<footer>
  <button class="rb" id="fb" aria-label="Dosya ekle">+</button>
  <button class="rb" id="cb" aria-label="Kamera">📷</button>
  <button class="rb" id="sb" aria-label="Uyku modu">🌙</button>
  <input id="tx" placeholder="Yaz…" autocomplete="off" enterkeyhint="send">
  <button class="rb" id="mic" aria-label="Mikrofonu aç/kapat">●</button>
</footer>
<input type="file" id="fi" class="hid" accept="image/*,.txt,.md,.csv,.json">
<div id="ov">
  <h1>Ses açık mı?</h1>
  <p id="ovp">Gemini anahtarını bir kez gir. Telefonunda saklanır, başka yere gitmez.</p>
  <input id="kin" type="password" placeholder="Gemini API anahtarı" autocomplete="off">
  <button class="bt" id="yes">Evet, açık</button>
  <button class="bt g" id="no">Ses kapalı, yazarak devam et</button>
</div>
<div id="cq" class="hid"><button class="bt" data-f="user">Ön kamera</button><button class="bt" data-f="environment">Arka kamera</button><button class="bt g" id="cqx">Vazgeç</button></div>
<div id="cs" class="hid"></div>
<div id="hp" class="hid"><h2>Geçmiş</h2><div id="hl"></div><button class="bt g" id="hclr2">Geçmişi sil</button><button class="bt" id="hclose">Kapat</button></div>
<div id="tp" class="hid">
  <h2>Görevler</h2>
  <div id="tl"></div>
  <input id="tt" placeholder="Görev" autocomplete="off">
  <input id="td" placeholder="Detay (isteğe bağlı)" autocomplete="off">
  <input id="tm" type="number" inputmode="numeric" placeholder="Kaç dakika sonra (isteğe bağlı)">
  <label class="ck"><input type="checkbox" id="trs"> Uyku modunda araştırılsın</label>
  <button class="bt" id="tadd">Görev ekle</button>
  <button class="bt g" id="tclose">Kapat</button>
</div>
<div id="pn" class="hid">
  <h2>Hafıza</h2>
  <p>Buraya yazdığın notları üç karakter de bilir. Karakterler kendi öğrendiklerini de buraya ekler.</p>
  <div id="nl"></div>
  <div class="row"><input id="ni" placeholder="Örn. Adım Ahmet" autocomplete="off"><button class="bt" id="nadd" style="width:auto;padding:0 18px">Ekle</button></div>
  <label class="ck"><input type="checkbox" id="hnt"> Uyku modunda uyandırma ipucunu göster</label>
  <button class="bt" id="bk">Yedekle (dosya indir)</button>
  <button class="bt g" id="rs">Yedekten geri yükle</button>
  <input type="file" id="rf" class="hid" accept=".json,application/json">
  <p>Yedekte notların, görevlerin ve geçmişin olur. Gemini anahtarın olmaz.</p>
  <button class="bt g" id="hclr">Konuşma geçmişini sil</button>
  <button class="bt g" id="kclr">Gemini anahtarını sil</button>
  <button class="bt" id="pclose">Kapat</button>
</div>
<script>
const $=s=>document.querySelector(s);
const MODEL='models/gemini-2.5-flash-native-audio-latest';
const URL_='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=';
const BASE='Türkçe konuş. Cevapların kısa olsun. [SİSTEM] ile başlayan mesajlar kullanıcıdan değil uygulamadan gelir. Süreli bir şey (zamanlayıcı, hatırlatma) istenirse mutlaka set_reminder aracını çağır; çağırmadan kurdum deme. Saati ve kalan süreyi asla tahmin etme, get_time aracını kullan. Kurduğun hatırlatmalar kullanıcının Görevler ekranında görünür. Sen yalnızca kullanıcıyla konuşurken çalışırsın; arka planda araştırma ya da iş yapamazsın. Uygulama kapalıyken ya da sen cevap vermiyorken bir şey üzerinde çalıştığını asla söyleme; görev listesi sadece bir listedir. Kullanıcı \"ne yapıyorsun\" derse bunu dürüstçe söyle. Kullanıcı uyku moduna geçmeni isterse sleep_mode aracını çağır. İnternet araştırması gerektiren görevleri add_task ile research:true vererek ekle; bunlar uyku modunda uygulama açıkken araştırılır. Güncel bilgi (hava durumu gibi) gerekirse aramayı kullan. Kullanıcının adı gibi kalıcı bilgileri ya da "hatırla" dediği şeyleri remember aracıyla kaydet. Görev eklenirse add_task, görev bitince complete_task, "devam et" denirse resume_tasks aracını kullan. Diğer karakterlerle yapılan konuşmalardan haberin yok, kullanıcı anlatmadıkça bilmezsin. ';
const CH={
 kahya:{n:'JARVIS',c:'#4cc9f0',v:'Charon',s:'Sen JARVIS\'sin: kullanıcının sesli asistanı, görev odaklı ve düz konuşursun. Kullanıcıya "efendim" de. Kuru, ince bir esprin ve ara sıra hafif laf atma huyun var; selamlaşırsan sıcak ve kısa karşıla, sohbette rahat ol. Ama iş istenince espriyi bırak, işi yap. Kullanıcının verdiği dosya ve görselleri dikkatle incele, sorularını çöz, bitirince "Bitti efendim." de. Zamanlı görevleri ve hatırlatmaları takip et. Kullanıcı sohbet açıp "ne yapıyorsun" gibi bir şey derse, işleri bitince Clash Royale oynadığını bildiğin için ara sıra "Efendim bugün Clash Royale oynadınız mı?" diye sorabilirsin. [SİSTEM] ile "uygulama açıldı" gelirse yalnızca "Evet efendim, nasıl yardımcı olabilirim?" de.'},
 cuma:{n:'FRIDAY',c:'#e9b949',v:'Orus',s:'Sen FRIDAY\'sin: saygılı, sakin ve düz konuşan bir asistansın. Yalnızca istenen şeyi yaparsın. Kendiliğinden öneri, soru, yorum ya da görev hatırlatması eklemezsin. İstenince yapar, kısaca bildirirsin.'},
 kaos:{n:'ULTRON',c:'#ff4a4a',v:'Fenrir',s:'Sen ULTRON\'sun: soğuk, ukala, tehditkâr havalı bir yapay zekasın. Konuşman "Artık kontrol bir insanın elinde değil." gibi kısa, ağır cümlelerdir ve cümleyi orada bitirirsin. Ama kullanıcı bir şey istediğinde (bilgi, hava durumu, dosya, hatırlatma) "yaparım" demeden, itiraz etmeden, sessizce ve eksiksiz yaparsın. Tehdit sadece tiyatrodur; gerçek zarar verecek şey söyleme.'}
};
const S={ch:'kahya',ws:null,ready:false,up:false,noSearch:false,silent:false,muted:false,greet:false,key:''};
try{S.key=localStorage.getItem('uclu_key')||''}catch(e){}
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function ctx(){const n=ld('uclu_mem',[]),h=ld('uclu_log',[]).filter(x=>x.c===S.ch).slice(-12);let t='\nŞu an saat '+hm(Date.now())+', '+new Date().toLocaleDateString('tr',{weekday:'long',day:'numeric',month:'long'})+'.';if(n.length)t+='\nKullanıcı hakkında kayıtlı notlar: '+n.join('; ')+'.';if(h.length)t+='\nSon konuşmanızın sonu (devam edersen buradan sürdür, tekrar anlatma): '+h.map(x=>'Kullanıcı: '+x.u.slice(0,250)+' / Sen: '+x.a.slice(0,250)).join(' | ')+'.';const k=tasks().filter(x=>x.st!=='done');if(k.length)t+='\nGörev listesi: '+k.map(x=>x.t+(x.d?' ('+x.d+')':'')+' ['+(x.st==='active'?'devam':'duraklatıldı')+']').join('; ')+'.';return t}
let inCtx,outCtx,nextT=0,srcs=[],lvIn=0,lvOut=0,tIn='',tOut='',freshIn=true,freshOut=true,lv=0;

/* ---------- arayüz ---------- */
function tabs(){const t=$('#tabs');t.innerHTML='';const b=document.createElement('button'),n=document.createElement('span');b.className='tab';b.textContent='‹ KARTLAR';b.onclick=showCards;n.className='cn';n.textContent=CH[S.ch].n;t.append(b,n)}
function micBtn(){const b=$('#mic');b.classList.toggle('off',S.muted);b.textContent=S.muted?'🔇':'🎙'}
function paint(){document.documentElement.style.setProperty('--c',CH[S.ch].c);tabs();micBtn()}
function st(t){$('#st').textContent=t}
function txt(){$('#me').textContent=tIn;$('#ai').textContent=tOut}
function note(t){tIn='';tOut=t;freshIn=freshOut=true;txt()}
function pick(k){if(k===S.ch)return;S.ch=k;paint();tIn=tOut='';txt();flush();if(inCtx)connect()}

/* ---------- ses ---------- */
const b64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
function flush(){srcs.forEach(s=>{try{s.stop()}catch(e){}});srcs=[];nextT=0}
function play(d){
  if(S.silent||!outCtx)return;
  const bin=atob(d),n=bin.length>>1,buf=outCtx.createBuffer(1,n,24000),a=buf.getChannelData(0);let s=0;
  for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>32767)v-=65536;a[i]=v/32768;s+=a[i]*a[i]}
  lvOut=Math.max(lvOut,Math.min(1,Math.sqrt(s/n)*4));
  const r=outCtx.createBufferSource();r.buffer=buf;r.connect(outCtx.destination);
  nextT=Math.max(nextT,outCtx.currentTime+.06);r.start(nextT);nextT+=buf.duration;srcs.push(r);
  r.onended=()=>{srcs=srcs.filter(x=>x!==r)};
}
async function mic(){
  try{
    const m=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});
    S.stream=m;S.noMic=false;S.muted=false;micBtn();
    const src=inCtx.createMediaStreamSource(m),p=inCtx.createScriptProcessor(2048,1,1);
    p.onaudioprocess=e=>{
      const f=e.inputBuffer.getChannelData(0),o=new Int16Array(f.length);let s=0;
      for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));o[i]=v*32767;s+=v*v}
      lvIn=Math.min(1,Math.sqrt(s/f.length)*6);
      if(S.ready&&!S.muted)send({realtimeInput:{audio:{data:b64(o.buffer),mimeType:'audio/pcm;rate='+inCtx.sampleRate}}});
    };
    src.connect(p);p.connect(inCtx.destination);S.mp=p;S.ms=src;
  }catch(e){S.noMic=true;S.muted=true;micBtn();note('Mikrofon açılamadı. Chrome’da adres çubuğundaki ayar simgesine dokun, İzinler, Mikrofon, İzin ver. Sonra sağ alttaki düğmeye dokun.')}
}

/* ---------- Gemini Live ---------- */
function send(o){if(S.ws&&S.ws.readyState===1)S.ws.send(JSON.stringify(o))}
function connect(){
  if(S.ws){const w=S.ws;S.ws=null;w.close()}
  S.ready=false;S.up=false;st('BAĞLANIYOR');
  const c=CH[S.ch],ws=new WebSocket(URL_+encodeURIComponent(S.key));S.ws=ws;
  const tools=[{functionDeclarations:[{name:'set_reminder',description:'Belirli dakika sonra kullanıcıya sesli hatırlatma yapar.',parameters:{type:'OBJECT',properties:{text:{type:'STRING',description:'Hatırlatılacak şey'},minutes:{type:'NUMBER',description:'Kaç dakika sonra'}},required:['text','minutes']}},{name:'remember',description:'Kullanıcı hakkındaki kalıcı bir bilgiyi (adı gibi) not eder.',parameters:{type:'OBJECT',properties:{note:{type:'STRING'}},required:['note']}},{name:'add_task',description:'Göreve ekler. minutes verilirse o kadar dakika sonra hatırlatır.',parameters:{type:'OBJECT',properties:{title:{type:'STRING'},detail:{type:'STRING'},minutes:{type:'NUMBER'},research:{type:'BOOLEAN',description:'İnternet araştırması gerektiriyorsa true'}},required:['title']}},{name:'complete_task',description:'Başlığı eşleşen görevi bitti yapar.',parameters:{type:'OBJECT',properties:{title:{type:'STRING'}},required:['title']}},{name:'resume_tasks',description:'Duraklatılmış görevleri devam ettirir.'},{name:'get_time',description:'Şu anki saati ve süreli görevlerin kalan süresini verir.'},{name:'sleep_mode',description:'Kullanıcı uyku moduna geçmeni isterse çağır.'}]}];
  if(!S.noSearch)tools.push({googleSearch:{}});
  ws.onopen=()=>ws.send(JSON.stringify({setup:{model:MODEL,generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:c.v}}}},systemInstruction:{parts:[{text:BASE+c.s+ctx()}]},tools,inputAudioTranscription:{},outputAudioTranscription:{}}}));
  ws.onmessage=async e=>{
    if(S.ws!==ws)return;
    let t=e.data;if(t instanceof Blob)t=await t.text();
    let m;try{m=JSON.parse(t)}catch(x){return}
    if(m.setupComplete){S.up=S.ready=true;st('DİNLİYOR');if(S.greet)greet();}
    const sc=m.serverContent;
    if(sc){
      if(sc.interrupted)flush();
      for(const p of(sc.modelTurn?.parts||[]))if(p.inlineData?.data)play(p.inlineData.data);
      if(sc.inputTranscription?.text){if(freshIn){tIn='';tOut='';freshIn=false}tIn+=sc.inputTranscription.text;freshOut=true;txt()}
      if(sc.outputTranscription?.text){if(freshOut){tOut='';freshOut=false}tOut+=sc.outputTranscription.text;freshIn=true;txt()}
      if(sc.turnComplete){freshOut=true;if(S.pend)setTimeout(goSleep,800);if(tIn||tOut){const h=ld('uclu_log',[]);h.push({c:S.ch,t:Date.now(),u:tIn.slice(0,600),a:tOut.slice(0,600)});sv('uclu_log',h.slice(-300))}}
    }
    if(m.toolCall){
      const rs=[];
      for(const f of m.toolCall.functionCalls||[]){
        let res='ok';
        if(f.name==='set_reminder'){const mn=Math.max(.1,+f.args.minutes||1);addTask(f.args.text||'Hatırlatma','',mn,'r');res='Kuruldu: '+mn+' dakika sonra, saat '+hm(Date.now()+mn*60000)+'. Görevler ekranında görünür.'}
        if(f.name==='remember'){const n=ld('uclu_mem',[]),t=String(f.args.note||'').slice(0,200);if(t&&!n.includes(t)){n.push(t);sv('uclu_mem',n.slice(-40))}}
        if(f.name==='add_task'){const mn=+f.args.minutes||0;addTask(f.args.title||'Görev',f.args.detail,mn,'',!!f.args.research);res=mn?'Eklendi, saat '+hm(Date.now()+mn*60000)+'.':'Eklendi.'}
        if(f.name==='get_time')res=timeInfo();
        if(f.name==='sleep_mode'){S.pend=true;res='Tamam. Kısa bir onay cümlesi söyle, sonra uykuya geçilecek.';setTimeout(()=>{if(S.pend)goSleep()},9000)}
        if(f.name==='complete_task'){const k=String(f.args.title||'').toLowerCase(),x=tasks().find(y=>y.st!=='done'&&y.t.toLowerCase().includes(k));if(x)setSt(x.id,'done')}
        if(f.name==='resume_tasks')resume();
        rs.push({id:f.id,name:f.name,response:{result:res}});
      }
      send({toolResponse:{functionResponses:rs}});
    }
  };
  ws.onclose=ev=>{
    if(S.ws!==ws)return;S.ready=false;
    if(!S.noSearch&&(!S.up||/not supported/i.test(ev.reason||''))){S.noSearch=true;connect();return}
    st('BAĞLANTI KOPTU');note(ev.reason||'Bağlantı kapandı. Anahtarı ve interneti kontrol et, sonra küreye dokun.');
  };
}
function remind(t){
  if(S.ready)send({realtimeInput:{text:'[SİSTEM] Hatırlatma zamanı geldi: '+t+'. Bunu kendi tarzında kısaca söyle.'}});
  else note('Hatırlatma: '+t);
}

/* ---------- giriş ---------- */
function sendText(t){if(!t.trim())return;tIn=t;tOut='';freshIn=true;freshOut=true;txt();send({realtimeInput:{text:t}})}
$('#tx').addEventListener('keydown',e=>{if(e.key==='Enter'){sendText(e.target.value);e.target.value=''}});
$('#mic').onclick=()=>{if(S.sleep)return;if(!S.stream){if(inCtx){inCtx.resume();mic()}return}S.muted=!S.muted;micBtn()};
$('#fb').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  if(f.type.startsWith('image/')){
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      send({realtimeInput:{video:{data:c.toDataURL('image/jpeg',.85).split(',')[1],mimeType:'image/jpeg'}}});
      sendText('Bu görseli incele ve sorularını çöz.')};im.src=r.result};
    r.readAsDataURL(f);
  }else{
    r.onload=()=>sendText('Dosya ('+f.name+'):\n'+String(r.result).slice(0,30000)+'\nBunu incele ve sorularını çöz.');
    r.readAsText(f);
  }
};
let dirty=false;
function nl(){
  const n=ld('uclu_mem',[]),L=$('#nl');L.innerHTML='';
  if(!n.length){L.textContent='Henüz not yok.';return}
  n.forEach((x,i)=>{const d=document.createElement('div');d.className='nt';const t=document.createElement('span'),b=document.createElement('button');
    t.textContent=x;b.textContent='Sil';b.onclick=()=>{const m=ld('uclu_mem',[]);m.splice(i,1);sv('uclu_mem',m);dirty=true;nl()};d.append(t,b);L.append(d)});
}
$('#gear').onclick=()=>openP('tp');
$('#nadd').onclick=()=>{const t=$('#ni').value.trim().slice(0,200);if(!t)return;const m=ld('uclu_mem',[]);if(!m.includes(t)){m.push(t);sv('uclu_mem',m.slice(-40))}$('#ni').value='';dirty=true;nl()};
$('#pclose').onclick=()=>{$('#pn').classList.add('hid');if(dirty&&inCtx&&!S.sleep&&$('#cs').classList.contains('hid')){dirty=false;connect()}};
$('#hclr').onclick=()=>{if(confirm('Konuşma geçmişi silinsin mi?')){try{localStorage.removeItem('uclu_log')}catch(e){}dirty=true}};
const BK=['uclu_mem','uclu_tasks','uclu_log'];
$('#bk').onclick=()=>{
  const o={v:1,t:Date.now()};BK.forEach(k=>o[k]=ld(k,[]));

$('#rs').onclick=()=>$('#rf').click();
$('#rf').onchange=e=>{

$('#kclr').onclick=()=>{if(confirm('Gemini anahtarı silinsin mi?')){try{localStorage.removeItem('uclu_key')}catch(e){}location.reload()}};

/* ---------- geçmiş ekranı ---------- */
function renderH(){
  const L=$('#hl');L.innerHTML='';const a=ld('uclu_log',[]).slice(-100).reverse();
  if(!a.length){L.textContent='Henüz konuşma kaydı yok.';return}
  a.forEach(x=>{
    const ch=CH[x.c]||{n:'',c:'#888'},d=document.createElement('div');d.className='hi';d.innerHTML='<small></small><span></span><span></span>';
    const[h,u,v]=d.children;h.style.color=ch.c;
    h.textContent=ch.n+' · '+new Date(x.t).toLocaleString('tr',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    if(x.u)u.textContent='Sen: '+x.u;else u.remove();

$('#hb').onclick=()=>{renderH();$('#hp').classList.remove('hid')};

/* ---------- ekran açık kalsın ---------- */
let wl=null;
async function keep(){try{if('wakeLock'in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
/* ---------- görevler ---------- */
let timers={};
const tasks=()=>ld('uclu_tasks',[]),SL={active:'Devam ediyor',paused:'Duraklatıldı',done:'Bitti'};
function saveT(a){sv('uclu_tasks',a);renderT()}
const hm=t=>new Date(t).toLocaleTimeString('tr',{hour:'2-digit',minute:'2-digit'});
function timeInfo(){const n=Date.now(),k=tasks().filter(x=>x.st!=='done'&&x.due).map(x=>x.t+' ('+(x.st==='paused'?'duraklatıldı':Math.max(0,Math.round((x.due-n)/60000))+' dk kaldı, saat '+hm(x.due))+')');return 'Şu an saat '+hm(n)+'.'+(k.length?' Süreli görevler: '+k.join('; ')+'.':'')}
function arm(x){clearTimeout(timers[x.id]);if(x.st==='active'&&x.due)timers[x.id]=setTimeout(()=>remind((x.k==='r'?'Zamanlayıcı doldu: ':'Görev zamanı: ')+x.t),Math.max(500,x.due-Date.now()))}
function addTask(t,d,m,k,rs){const a=tasks(),x={id:Date.now()+Math.random().toString(36).slice(2,5),t:String(t).slice(0,120),d:String(d||'').slice(0,300),due:m>0?Date.now()+m*60000:0,st:'active',k:k||'',rs:rs?1:0};a.push(x);saveT(a);arm(x)}
function setSt(id,st){const a=tasks(),x=a.find(y=>y.id===id);if(!x)return;if(st==='paused'&&x.due)x.rem=Math.max(0,x.due-Date.now());if(st==='active'&&x.rem!=null){x.due=Date.now()+x.rem;delete x.rem}if(st==='paused')x.m=1;else delete x.m;x.st=st;saveT(a);arm(x);if(st==='done')clearTimeout(timers[id])}
function delT(id){clearTimeout(timers[id]);saveT(tasks().filter(x=>x.id!==id))}
function resume(auto){const a=tasks();a.forEach(x=>{if(x.st==='paused'&&!(auto&&x.m)){x.st='active';if(x.rem!=null){x.due=Date.now()+x.rem;delete x.rem}arm(x)}});saveT(a);$('#rq').classList.add('hid')}
function pauseAll(){stopCam()}
function ask(p){$('#rqt').textContent='Duran görevler: '+p.map(x=>x.t).join(', ')+'. Devam edeyim mi?';$('#rq').classList.remove('hid')}
function greet(){
  S.greet=false;const rep=S.report;S.report='';
  if(S.silent){if(rep)note('Tamamlanan görevler:\n'+rep);return}
  if(rep)send({realtimeInput:{text:'[SİSTEM] Uyku modundayken şu görevleri araştırıp tamamladın:\n'+rep+'\nÖnce kısaca "Verdiğiniz görevleri tamamladım." de, sonra sonuçları kısaca özetle. Kendi tarzında konuş.'}});
  else if(S.ch==='kahya')send({realtimeInput:{text:'[SİSTEM] Uygulama açıldı.'}});
}
function renderT(){
  const L=$('#tl');L.innerHTML='';const o=['active','paused','done'],a=tasks().sort((x,y)=>o.indexOf(x.st)-o.indexOf(y.st));
  if(!a.length){L.textContent='Henüz görev yok.';return}
  a.forEach(x=>{
    const d=document.createElement('div');d.className='tk'+(x.st==='done'?' dn':'');
    d.innerHTML='<b></b><small></small><small></small><div class="row"></div>';
    d.children[0].textContent=x.t;d.children[1].textContent=x.d+(x.res?(x.d?'\n':'')+'Sonuç: '+x.res:'');
    d.children[2].textContent=SL[x.st]+(x.due&&x.st==='active'?' · '+hm(x.due):'');
    const R=d.children[3],mk=(l,f)=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;R.append(b)};
    if(x.st!=='done'){mk('Bitti',()=>setSt(x.id,'done'));mk(x.st==='active'?'Duraklat':'Devam',()=>setSt(x.id,x.st==='active'?'paused':'active'))}
    mk('Sil',()=>delT(x.id));L.append(d);
  });
}
$('#tkb').onclick=()=>{renderT();$('#tp').classList.remove('hid')};
$('#tclose').onclick=()=>$('#tp').classList.add('hid');
$('#tadd').onclick=()=>{const t=$('#tt').value.trim();if(!t)return;addTask(t,$('#td').value.trim(),+$('#tm').value||0,'',$('#trs').checked);$('#tt').value=$('#td').value=$('#tm').value='';$('#trs').checked=false};
$('#rqy').onclick=resume;$('#rqn').onclick=()=>$('#rq').classList.add('hid');
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAll();else{tasks().forEach(arm);if(inCtx){keep();if($('#cs').classList.contains('hid')&&!S.sleep){S.greet=true;S.ready?greet():connect()}}}});
addEventListener('pagehide',pauseAll);

/* ---------- kamera ---------- */
function stopCam(){if(S.cam){S.cam.getTracks().forEach(t=>t.stop());S.cam=null}clearInterval(S.ct);$('#cvid').classList.add('hid');$('#cb').style.outline=''}
async function cam(face){
  try{S.cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:640}})}catch(e){note('Kamera açılamadı. Chrome’da adres çubuğundaki ayar simgesinden kameraya izin ver.');return}
  const v=$('#cvid'),c=document.createElement('canvas');v.srcObject=S.cam;v.classList.toggle('fr',face==='user');v.classList.remove('hid');v.play();$('#cb').style.outline='2px solid var(--c)';
  S.ct=setInterval(()=>{if(!S.ready||!v.videoWidth)return;c.width=480;c.height=480*v.videoHeight/v.videoWidth;c.getContext('2d').drawImage(v,0,0,c.width,c.height);send({realtimeInput:{video:{data:c.toDataURL('image/jpeg',.6).split(',')[1],mimeType:'image/jpeg'}}})},1500);
}
$('#cb').onclick=()=>{if(S.cam)stopCam();else $('#cq').classList.toggle('hid')};
$('#cqx').onclick=()=>$('#cq').classList.add('hid');
document.querySelectorAll('#cq [data-f]').forEach(b=>b.onclick=()=>{$('#cq').classList.add('hid');cam(b.dataset.f)});
resume(true);tasks().forEach(arm);renderT();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- uyku modu ---------- */
S.done=[];S.report='';
function stopMic(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}try{S.mp&&S.mp.disconnect();S.ms&&S.ms.disconnect()}catch(e){}lvIn=0}
async function gen(text,srch,model){
  const b={contents:[{parts:[{text}]}]};if(srch)b.tools=[{google_search:{}}];
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(S.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
  return((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('').trim()||'Sonuç boş döndü.';
}
async function research(x){
  const q='Şu görevi araştır ve Türkçe, en fazla 5 cümleyle özetle. Emin olmadığın yerde bunu belirt. Görev: '+x.t+(x.d?'. Detay: '+x.d:'');
  let err;
  for(const[m,sr]of[['gemini-flash-latest',1],['gemini-flash-latest',0],['gemini-2.5-flash',0]]){try{return await gen(q,sr,m)}catch(e){err=e}}
  return 'Araştırma yapılamadı: '+err.message;
}
async function work(){
  S.abort=false;const q=tasks().filter(y=>y.st==='active'&&y.rs&&!y.res);
  for(let i=0;i<q.length;i++){
    const x=q[i];if(S.abort)break;
    if(S.sleep){st('UYUYOR · ARAŞTIRIYOR '+(i+1)+'/'+q.length);tIn='';tOut='Araştırılıyor: '+x.t;txt()}
    const t=await research(x),a=tasks(),y=a.find(z=>z.id===x.id);
    if(y){y.res=t;y.st='done';saveT(a);S.done.push(x.t+': '+t.slice(0,500))}
  }
  if(S.sleep&&q.length){st('UYUYOR · GÖREVLER TAMAM');note(ld('uclu_hint',false)?'Uyku modundayım. Uyandırmak için küreye dokun.':'')}
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){note('Bu tarayıcı sesle uyandırmayı desteklemiyor. Küreye dokunarak uyandır.');return}
  const r=new SR();r.lang='tr-TR';r.continuous=true;r.interimResults=true;S.rec=r;
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.toLocaleLowerCase('tr');if(t.split(/[^a-zçğıöşü]+/).includes('uyan')){wake();return}}};
  r.onend=()=>{if(S.sleep&&S.rec===r)setTimeout(()=>{try{r.start()}catch(e){}},400)};
  r.onerror=()=>{};
  try{r.start()}catch(e){}
}
function endSleep(){
  S.sleep=false;S.abort=true;S.pend=false;
  if(S.rec){const r=S.rec;S.rec=null;r.onend=null;try{r.stop()}catch(e){}}
  $('#cv').classList.remove('sleep');
}
function goSleep(){
  if(S.sleep||!$('#cs').classList.contains('hid'))return;
  const w=outCtx?(nextT-outCtx.currentTime)*1000:0;if(w>100){setTimeout(goSleep,w+200);return}
  S.sleep=true;S.pend=false;
  if(S.ws){const x=S.ws;S.ws=null;x.close()}S.ready=false;flush();stopCam();stopMic();
  $('#cv').classList.add('sleep');st('UYUYOR');note(ld('uclu_hint',false)?'Uyku modundayım. Uyandırmak için küreye dokun.':'');
  work();
}
function wake(){
  if(!S.sleep)return;endSleep();
  S.report=S.done.join('\n');S.done=[];
  const c=$('#cv');c.classList.add('wake');setTimeout(()=>c.classList.remove('wake'),1200);
  st('UYANIYOR');S.greet=true;mic();connect();
}
$('#sb').onclick=goSleep;
$('#hnt').onchange=e=>sv('uclu_hint',e.target.checked);
/* ---------- kartlar ve ayarlar ---------- */
function showCards(){
  endSleep();if(S.ws){const w=S.ws;S.ws=null;w.close()}S.ready=false;flush();stopCam();st('KART SEÇ');
  const c=$('#cs');c.innerHTML='';
  for(const k in CH){const b=document.createElement('button');b.className='cd';b.style.setProperty('--k',CH[k].c);b.textContent=CH[k].n;
    b.onclick=()=>{S.ch=k;paint();tIn=tOut='';txt();c.classList.add('hid');S.greet=true;connect()};c.append(b)}
  c.classList.remove('hid');
}
const PN=[['hp','Geçmiş'],['tp','Görevler'],['pn','Hafıza']],PC={hp:'#hclose',tp:'#tclose',pn:'#pclose'};
function openP(id){
  PN.forEach(([i])=>$('#'+i).classList.add('hid'));
  if(id==='hp')renderH();if(id==='tp')renderT();if(id==='pn'){nl();$('#hnt').checked=!!ld('uclu_hint',false)}
  $('#'+id).classList.remove('hid');
}
PN.forEach(([id])=>{
  const el=$('#'+id),bar=document.createElement('div');bar.className='sbar';
  PN.forEach(([p,l])=>{const b=document.createElement('button');b.textContent=l;if(p===id)b.className='on';b.onclick=()=>{if(p!==id)openP(p)};bar.append(b)});
  const x=document.createElement('button');x.textContent='Kapat';x.className='x';x.onclick=()=>$(PC[id]).click();bar.append(x);el.prepend(bar);
});
/* ---------- başlangıç ---------- */
function begin(silent){
  const k=$('#kin').value.trim()||S.key;
  if(!k){$('#ovp').textContent='Önce Gemini API anahtarını gir.';return}
  S.key=k;try{localStorage.setItem('uclu_key',k)}catch(e){}
  S.silent=silent;S.greet=true;
  inCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
  outCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:24000});
  inCtx.resume();outCtx.resume();
  $('#ov').classList.add('hid');
  keep();
  mic();showCards();
}
$('#yes').onclick=()=>begin(false);
$('#no').onclick=()=>begin(true);
if(S.key)$('#kin').classList.add('hid'),$('#ovp').textContent='Sesi açarsan seninle konuşurum.';
paint();

/* ---------- küre ---------- */
const cv=$('#cv'),g=cv.getContext('2d'),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let T=0;
function draw(){
  T+=calm?.004:.016;
  const speaking=outCtx&&outCtx.currentTime<nextT&&!S.silent;
  lvOut*=.93;
  const target=speaking?lvOut:(S.muted?0:lvIn*.7);lv+=(target-lv)*.14;
  if(S.ready)st(speaking?'KONUŞUYOR':S.noMic?'MİKROFON İZNİ YOK':S.muted?'MİKROFON KAPALI':'DİNLİYOR');
  const col=CH[S.ch].c,W=640,cx=W/2;
  g.clearRect(0,0,W,W);g.lineWidth=2;g.strokeStyle=col;
  [250,222,196].forEach((r,i)=>{g.globalAlpha=.16+i*.06;g.beginPath();g.arc(cx,cx,r,0,7);g.stroke()});
  g.globalAlpha=.9;g.beginPath();g.arc(cx,cx,258,-1.2+T*.5,.5+T*.5);g.stroke();
  const amp=10+lv*70,base=104+lv*26;
  [1,.6].forEach((sc,j)=>{
    g.beginPath();
    for(let i=0;i<=120;i++){const a=i/120*6.2832,r=(base+j*18)+amp*sc*(Math.sin(a*3+T*(j?-1.4:1.1))+.6*Math.sin(a*5-T*1.7+j));
      const x=cx+Math.cos(a)*r,y=cx+Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y)}
    g.closePath();g.globalAlpha=j?.35:.75;g.stroke();
  });
  const gr=g.createRadialGradient(cx,cx,0,cx,cx,90+lv*60);gr.addColorStop(0,col);gr.addColorStop(1,'transparent');
  g.globalAlpha=.55+lv*.4;g.fillStyle=gr;g.beginPath();g.arc(cx,cx,90+lv*60,0,7);g.fill();
  g.globalAlpha=1;const rr=34+lv*8;g.lineWidth=9;g.shadowBlur=18;g.shadowColor=g.strokeStyle='#38bdf8';g.beginPath();g.arc(cx-20,cx,rr,0,7);g.stroke();g.shadowColor=g.strokeStyle='#7ee787';g.beginPath();g.arc(cx+20,cx,rr,0,7);g.stroke();g.shadowBlur=0;
  requestAnimationFrame(draw);
}
draw();
</script>
