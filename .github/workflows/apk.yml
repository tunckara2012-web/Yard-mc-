name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Hazirla
        run: |
          npm install
          mkdir -p www
          cp index.html sw.js manifest.json icon-192.png icon-512.png www/
          npx cap add android
          npx cap sync android
      - name: Izinler ve simge
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          n=['RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','CAMERA','POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','WAKE_LOCK']
          perms=''.join('<uses-permission android:name="android.permission.%s"/>\n'%x for x in n)
          s=s.replace('</manifest>',perms+'</manifest>')
          open(p,'w',encoding='utf-8').write(s)
          PY
          python3 -m pip install --quiet --break-system-packages pillow || sudo apt-get install -y python3-pil
          python3 - <<'PY'
          import shutil
          from PIL import Image
          R='android/app/src/main/res'
          shutil.rmtree(R+'/mipmap-anydpi-v26', ignore_errors=True)
          im=Image.open('icon-512.png').convert('RGBA')
          for n,z in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              for f in ('ic_launcher.png','ic_launcher_round.png'):
                  im.resize((z,z),Image.LANCZOS).save('%s/mipmap-%s/%s'%(R,n,f))
          print('simge tamam')
          PY
      - name: APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          gh release delete apk-son -y --cleanup-tag || true
          gh release create apk-son Jarvis.apk --title "Jarvis APK" --notes "Son derleme"
