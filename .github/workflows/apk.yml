name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Hazirla
        run: |
          npm install
          mkdir -p www
          cp index.html sw.js manifest.json icon-192.png icon-512.png www/
          npx cap add android
          npx cap sync android
      - name: Izinler ve simge
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          n=['RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','CAMERA','POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','WAKE_LOCK','READ_CALENDAR','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','ACCESS_NETWORK_STATE','BLUETOOTH_CONNECT']
          perms=''.join('<uses-permission android:name="android.permission.%s"/>\n'%x for x in n)
          perms+='<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>\n'
          perms+='<queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>\n'
          s=s.replace('</manifest>',perms+'</manifest>')
          open(p,'w',encoding='utf-8').write(s)
          PY
          J=android/app/src/main/java/com/jarvis/asistan
          cp JarvisNative.java $J/JarvisNative.java
          cat > $J/MainActivity.java <<'JAVA'
          package com.jarvis.asistan;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(JarvisNative.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          python3 -m pip install --quiet --break-system-packages pillow || sudo apt-get install -y python3-pil
          python3 - <<'PY'
          import shutil
          from PIL import Image
          R='android/app/src/main/res'
          shutil.rmtree(R+'/mipmap-anydpi-v26', ignore_errors=True)
          im=Image.open('icon-512.png').convert('RGBA')
          for n,z in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              for f in ('ic_launcher.png','ic_launcher_round.png'):
                  im.resize((z,z),Image.LANCZOS).save('%s/mipmap-%s/%s'%(R,n,f))
          print('simge tamam')
          PY
      - name: APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Yayinla
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "HATA: KEYSTORE_B64 gizli anahtari yok"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > jarvis.p12
          AS="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner"
          $AS sign --ks jarvis.p12 --ks-type pkcs12 --ks-pass pass:jarvis-pass --out Jarvis.apk android/app/build/outputs/apk/debug/app-debug.apk
          $AS verify Jarvis.apk
          gh release delete apk-son -y --cleanup-tag || true
          gh release create apk-son Jarvis.apk --title "Jarvis APK" --notes "Son derleme"
